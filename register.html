<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <section class="sub-header-register">
        <nav class="nav-links">
            <img src="icons/derby_university.png" alt="University Logo">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT US</a></li>
                <li><a href="register.html">REGISTER</a></li>
                <li><a href="login.html" class="btn">LOGIN</a></li>
            </ul>
        </nav>

        <div class="big-text">
            <h1>Register Now!</h1>
        </div>

        <!-- Proper form wrapping everything -->
        <div class="register-box">
            <form id="registerForm">
                <div class="form-flex-container">
                    <!-- ===== Personal Information ===== -->
                    <div class="form-section">
                        <h2>Personal Information</h2>
                        <div class="form-col">
                            <input type="text" id="fullName" placeholder="Full Name">
                            <input type="email" id="email" placeholder="Email">
                            <input type="text" id="phone" placeholder="Phone Number">
                        </div>
                    </div>

                    <!-- ===== Account Details ===== -->
                    <div class="form-section">
                        <h2>Account Details</h2>
                        <div class="form-col">
                            <input type="text" id="username" placeholder="Username">
                            <input type="password" id="password" placeholder="Password">
                            <input type="password" id="confirmPassword" placeholder="Confirm Password">
                        </div>
                    </div>
                </div>

                <!-- ===== Educ Background ===== --> 
                <div class="form-flex-container">
                    <div class="form-section">
                        <h2>Educational Background</h2>
                        <label for="stats">Stats/University:</label>

                        <select id="stats">
                            <option value="">-- Select the university you were enrolled in--</option>
                            <option value="Speed University">Speed University</option>
                            <option value="Guts University">Guts University</option>
                            <option value="Power University">Power University</option>
                            <option value="Stamina University">Stamina University</option>
                            <option value="Wit University">Wit University</option>
                        </select>
                    </div>
                    

                    <!-- ===== START CHANGES: Horizontal course-grade dropdowns ===== -->
                    <div class="specialty-row">
                        <div class="specialty-col">
                            <div class="course-grade">
                                <label for="Turf">Turf:</label>
                                <select id="Turf">
                                    <option value="">-- Select Grade --</option>
                                    <option value="S">S</option>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                    <option value="D">D</option>
                                    <option value="E">E</option>
                                    <option value="F">F</option>
                                    <option value="G">G</option>
                                </select>
                            </div>

                            <div class="course-grade">
                                <label for="Dirt">Dirt:</label>
                                <select id="Dirt">
                                    <option value="">-- Select Grade --</option>
                                    <option value="S">S</option>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                    <option value="D">D</option>
                                    <option value="E">E</option>
                                    <option value="F">F</option>
                                    <option value="G">G</option>
                                </select>
                            </div>
                        </div>
                            
                        <div class="specialty-col">
                            <div class="course-grade">
                                <label for="Sprint">Sprint:</label>
                                <select id="Sprint">
                                    <option value="">-- Select Grade --</option>
                                    <option value="S">S</option>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                    <option value="D">D</option>
                                    <option value="E">E</option>
                                    <option value="F">F</option>
                                    <option value="G">G</option>
                                </select>
                            </div>

                            <div class="course-grade">
                                <label for="Mile">Mile:</label>
                                <select id="Mile">
                                    <option value="">-- Select Grade --</option>
                                    <option value="S">S</option>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                    <option value="D">D</option>
                                    <option value="E">E</option>
                                    <option value="F">F</option>
                                    <option value="G">G</option>
                                </select>
                            </div>

                            <div class="course-grade">
                                <label for="Medium">Medium:</label>
                                <select id="Medium">
                                <option value="">-- Select Grade --</option>
                                <option value="S">S</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="G">G</option>
                                </select>
                            </div>

                            <div class="course-grade">
                                <label for="Long">Long:</label>
                                <select id="Long">
                                    <option value="">-- Select Grade --</option>
                                    <option value="S">S</option>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                    <option value="D">D</option>
                                    <option value="E">E</option>
                                    <option value="F">F</option>
                                    <option value="G">G</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="specialty-col">
                            <div class="course-grade">
                                <label for="EndCloser">End Closer:</label>
                                <select id="EndCloser">
                                <option value="">-- Select Grade --</option>
                                <option value="S">S</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="G">G</option>
                                </select>
                            </div>

                            <div class="course-grade">
                                <label for="FrontRunner">Front Runner:</label>
                                <select id="FrontRunner">
                                <option value="">-- Select Grade --</option>
                                <option value="S">S</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="G">G</option>
                                </select>
                            </div>

                            <div class="course-grade">
                                <label for="LateSurger">Late Surger:</label>
                                <select id="LateSurger">
                                <option value="">-- Select Grade --</option>
                                <option value="S">S</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="G">G</option>
                                </select>
                            </div>

                            <div class="course-grade">
                                <label for="PaceChaser">Pace Chaser:</label>
                                <select id="PaceChaser">
                                <option value="">-- Select Grade --</option>
                                <option value="S">S</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="G">G</option>
                                </select>
                            </div>
                        </div> 
                        <!-- ===== END CHANGES ===== -->       
                        
                        <!-- ===== Register Button ===== -->
                        <input type="submit" value="Register">
                        <!-- .form-flex-container -->
                        <p id="message"></p>
                </div>
            </form>
        </div>
    </section>

    <footer class="contact">
        <h1>Contact Us!</h1>
    </footer>

    <a href="#" class="back-to-top">
        <span class="material-icons">arrow_upward</span>
    </a>

    <script src="log-reg.js"></script>
</body>
</html>
