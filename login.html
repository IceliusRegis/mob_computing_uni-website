<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <section class="sub-header-register"> <!-- same style as register -->
        <nav class="nav-links">
            <img src="icons/derby_university.png" alt="University Logo">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT US</a></li>
                <li><a href="register.html">REGISTER</a></li>
                <li><a href="login.html" class="btn">LOGIN</a></li>
            </ul>
        </nav>

        <div class="big-text">
            <h1>Login</h1>
        </div>

        <div class="register-box"> <!-- same transparent box -->
            <form id="loginForm">
                <h2>Educational Background</h2>
                <label for="stats">Stats/University:</label><br>
                <select id="stats">
                    <option value="">-- Select University --</option>
                    <option value="Speed University">Speed University</option>
                    <option value="Guts University">Guts University</option>
                    <option value="Power University">Power University</option>
                    <option value="Stamina University">Stamina University</option>
                    <option value="Wit University">Wit University</option>
                </select><br><br>

                <h2>Account Details</h2>
                <input type="text" id="username" placeholder="Username"><br><br>
                <input type="password" id="password" placeholder="Password"><br><br>
                <input type="submit" value="Login">

                
            </form>
            <p id="loginMessage"></p>
            
        </div>
    </section>

    <footer class="contact">
        <h1>Contact Us!</h1>
    </footer>

    <a href="#" class="back-to-top">
        <span class="material-icons">arrow_upward</span>
    </a>

    <script src="log-reg.js"></script>
</body>
</html>
